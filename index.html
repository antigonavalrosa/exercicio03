<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechView - Conteúdo Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho fixo centralizado com Flexbox -->
    <header class="header">
        <h1>Cabeçalho</h1>
    </header>

    <div class="layout-body">
        <!-- Menu lateral fixo à esquerda com Flexbox em coluna -->
        <aside class="sidebar">
            <span class="sidebar-title">Menu<br>Links</span>
            <nav class="nav-links">
                <a href="#">Início</a>
                <a href="#">Serviços</a>
                <a href="#">Sobre Nós</a>
                <a href="#">Contato</a>
            </nav>
        </aside>

        <!-- Galeria principal com 6 blocos em 3 colunas e 2 linhas com CSS Grid -->
        <main class="main-content">
            <div class="grid-container">
                <div class="grid-item">1</div>
                <div class="grid-item">2</div>
                <div class="grid-item">3</div>
                <div class="grid-item">4</div>
                <div class="grid-item">5</div>
                <div class="grid-item">6</div>
            </div>
        </main>
    </div>

    <!-- Rodapé fixo centralizado com Flexbox -->
    <footer class="footer">
        <p>Rodapé</p>
    </footer>

</body>
</html>
